services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend/app:/app/app
    command: /start-reload.sh

  worker-vector:
    build:
      target: dev
    volumes:
      - ./backend/app:/app/app
    command:
      - 'watchfiles "celery -A app.worker.main.celery worker --queues=vector,common --include=app.worker.tasks.vector.task,app.worker.tasks.common.task --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY}" /app/app --filter python --ignore-paths /app/app/tests,/app/app/alembic'

  worker-point-cloud:
    build:
      target: dev
    volumes:
      - ./backend/app:/app/app
    command:
      - 'watchfiles "celery -A app.worker.main.celery worker --queues=point-cloud,common --include=app.worker.tasks.pointcloud.task,app.worker.tasks.common.task --loglevel=info --concurrency=${WORKER_POINT_CLOUD_CONCURRENCY:-2}" /app/app --filter python --ignore-paths /app/app/tests,/app/app/alembic'

  worker-mesh:
    build:
      target: dev
    volumes:
      - ./backend/app:/app/app
    command:
      - 'watchfiles "celery -A app.worker.main.celery worker --queues=mesh,common --include=app.worker.tasks.mesh.task,app.worker.tasks.common.task --loglevel=info --concurrency=${WORKER_MESH_CONCURRENCY:-1}" /app/app --filter python --ignore-paths /app/app/tests,/app/app/alembic'
