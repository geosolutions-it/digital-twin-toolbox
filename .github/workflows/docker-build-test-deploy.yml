name: Build frontend and backend, test and deploy

on:
  push:
    branches:
      - main
      - gha
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: build-test-deploy
  cancel-in-progress: false

jobs:
  lint:
    runs-on: self-hosted
    permissions:
      contents: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Lint backend
        working-directory: backend
        run: |
          uv run --locked ruff check app
          uv run --locked ruff format --check app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and type-check frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx biome ci .
          npx tsc --noEmit

  build-test-deploy:
    needs: lint
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: sh scripts/init-env.sh --force

      - name: Set image tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Build the docker images
        run: |
          docker logout
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.build.yml build \
            backend frontend worker-vector

      - name: Run tests
        run: sh scripts/test.sh

      - name: Login to DockerHub
        if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: ${{ vars.DOCKERHUB_OIDC_EXPIREIN }}

      - name: Push the images
        if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.build.yml push \
            backend frontend worker-vector
