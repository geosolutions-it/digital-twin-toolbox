name: Build frontend and backend, test and deploy

on:
  push:
    branches:
      - main
      - gha
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: sh scripts/init-env.sh --force

      - name: Build the docker images
        run: |
          DOCKER_BUILDKIT=1 docker compose \
            -f docker-compose.yml \
            -f docker-compose.build.yml build \
            backend frontend worker-vector

      - name: Run tests
        run: sh scripts/test-local.sh

  login-and-deploy:
     runs-on: self-hosted
     permissions:
      contents: read
      id-token: write
     needs: build-and-test
     if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')) }}
     steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: sh scripts/init-env.sh --force

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: ${{ vars.DOCKERHUB_OIDC_EXPIREIN }}

      - name: Deploy the images
        run: |
          source .env
          docker push $DOCKER_IMAGE_BACKEND:$TAG
          docker push $DOCKER_IMAGE_FRONTEND:$TAG
          docker push $DOCKER_IMAGE_WORKER:$TAG
