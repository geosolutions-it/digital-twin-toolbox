[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.11,<4.0"
dependencies = []

[dependency-groups]
worker = [
    "celery>=5.4.0,<6.0.0",
    "redis>=5.0.8,<6.0.0",
    "sqlmodel>=0.0.21,<1.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "pydantic>2.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "pyproj",
    "tenacity>=8.2.3,<9.0.0",
    "sentry-sdk>=1.40.6,<3.0.0",
    "boto3>=1.34.0,<2.0.0",
]
api = [
    {include-group = "worker"},
    "fastapi[standard]>=0.109.1,<1.0.0",
    "python-multipart>=0.0.7,<1.0.0",
    "gunicorn>=22.0.0,<23.0.0",
    "alembic>=1.12.1,<2.0.0",
    "httpx>=0.25.1,<1.0.0",
]
vector = [
    "earcut>=1.1.5,<2.0.0",
    "mapbox-earcut>=1.0.3,<2.0.0",
    "pymartini>=0.4.4,<1.0.0",
    "quantized-mesh-tile>=0.7.0,<1.0.0",
]
pointcloud = [
    "py3dtiles[las,ply]>=12.1.1,<13.0.0",
    "laspy[laszip]>=2.7.0,<3.0.0",
    "pdal>=3.5.5,<4.0.0",
]
mesh = [
    "xatlas>=0.0.11,<1.0.0",
    "fast-simplification>=0.1.11,<1.0.0",
    "embreex>=2.17.7,<3.0.0",
    "pillow>=13.0.0,<14.0.0",
]
dev = [
    "watchfiles>=1.0.0,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.2.2,<1.0.0",
    "pre-commit>=3.6.2,<4.0.0",
    "coverage>=7.4.3,<8.0.0",
    "moto[s3]>=5.0.0,<6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"
