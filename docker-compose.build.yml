services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}

  frontend:
    build:
      context: ./frontend
      args:
        - NODE_ENV=production

  worker-vector:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        INSTALL_DEV: ${INSTALL_DEV-false}
